            { id: 's54', brand: 'Samsung', model: 'Galaxy A57 5G', storage: '256GB', network: '5G', condition: 'New', category: 'Smartphone', supplierPrice: 399 }
        ];

        function App() {
            // Unlocked State (Passcode '314')
            const [isUnlocked, setIsUnlocked] = useState(() => sessionStorage.getItem('flipflow_unlocked') === 'true');
            const [passwordInput, setPasswordInput] = useState('');
            const [passwordError, setPasswordError] = useState(false);

            const [phones, setPhones] = useState(() => {
                const local = localStorage.getItem('flipflow_inventory');
                return local ? JSON.parse(local) : defaultPhones;
            });

            // Target ROI configurations
            const [globalTargetROI, setGlobalTargetROI] = useState(() => {
                const stored = localStorage.getItem('flipflow_global_roi');
                return stored ? Number(stored) : 35;
            });

            // Modal Reactive Input States
            const [modalBuyPrice, setModalBuyPrice] = useState("");
            const [modalExpectedSellPrice, setModalExpectedSellPrice] = useState("");
            const [modalLocalROI, setModalLocalROI] = useState(35);

            // Watchlist and Price Alerts State Managers
            const [watchlist, setWatchlist] = useState(() => {
                const local = localStorage.getItem('flipflow_watchlist');
                return local ? JSON.parse(local) : [];
            });

            const [priceAlerts, setPriceAlerts] = useState(() => {
                const local = localStorage.getItem('flipflow_alerts');
                return local ? JSON.parse(local) : [];
            });

            const [toasts, setToasts] = useState([]);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [syncLoading, setSyncLoading] = useState(false);
            
            // Filters (Inventory Tab)
            const [searchTerm, setSearchTerm] = useState('');
            const [filterModel, setFilterModel] = useState('');
            const [filterStatus, setFilterStatus] = useState('all');
            const [filterReinvestment, setFilterReinvestment] = useState('all');

            // Filters (Market Search Tab)
            const [marketSearchTerm, setMarketSearchTerm] = useState('iPhone 15 Pro');
            const [marketBrand, setMarketBrand] = useState('Apple');
            const [marketCondition, setMarketCondition] = useState(['New', 'Used', 'Refurbished']);
            const [marketStorage, setMarketStorage] = useState(['128GB', '256GB', '512GB']);
            const [marketColour, setMarketColour] = useState('All');
            const [marketSort, setMarketSort] = useState('Lowest Price');
            const [marketCountry, setMarketCountry] = useState('Spain');
            const [priceRangeMin, setPriceRangeMin] = useState(0);
            const [priceRangeMax, setPriceRangeMax] = useState(1500);

            // Filters (Mobile Prices - Local Supplier Tab)
            const [supplierSearchQuery, setSupplierSearchQuery] = useState('');
            const [supplierBrandFilter, setSupplierBrandFilter] = useState('');
            const [supplierConditionFilter, setSupplierConditionFilter] = useState('');
            const [supplierStorageFilter, setSupplierStorageFilter] = useState('');
            const [supplierCategoryFilter, setSupplierCategoryFilter] = useState('');
            const [supplierNetworkFilter, setSupplierNetworkFilter] = useState('');
            const [supplierMaxPrice, setSupplierMaxPrice] = useState(1200);
            const [supplierSortOrder, setSupplierSortOrder] = useState('Lowest Price');

            // Protectors Tab Search State
            const [protectorSearchQuery, setProtectorSearchQuery] = useState('');

            // Active list for Comparison Matrix
            const [selectedCompareIds, setSelectedCompareIds] = useState([]);
            const [marketSearching, setMarketSearching] = useState(false);
            const [marketSubTab, setMarketSubTab] = useState('listings');

            // Alerts creator state
            const [newAlertModel, setNewAlertModel] = useState('');
            const [newAlertTarget, setNewAlertTarget] = useState('');

            // Modals
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isEditModalOpen, setIsEditModalOpen] = useState(false);
            const [isSellModalOpen, setIsSellModalOpen] = useState(false);
            const [selectedPhone, setSelectedPhone] = useState(null);

            // Sync persistence
            useEffect(() => {
                localStorage.setItem('flipflow_inventory', JSON.stringify(phones));
            }, [phones]);

            useEffect(() => {
                localStorage.setItem('flipflow_watchlist', JSON.stringify(watchlist));
            }, [watchlist]);

            useEffect(() => {
                localStorage.setItem('flipflow_alerts', JSON.stringify(priceAlerts));
            }, [priceAlerts]);

            useEffect(() => {
                localStorage.setItem('flipflow_global_roi', globalTargetROI.toString());
            }, [globalTargetROI]);

            const triggerToast = (message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
            };

            // Fetch Cloud Data from Supabase on App Startup
            useEffect(() => {
                if (supabaseClient) {
                    setSyncLoading(true);
                    supabaseClient
                        .from('ledger_store')
                        .select('phones')
                        .eq('id', 'main_inventory')
                        .single()
                        .then(({ data, error }) => {
                            if (!error && data && data.phones) {
                                setPhones(data.phones);
                                localStorage.setItem('flipflow_inventory', JSON.stringify(data.phones));
                                triggerToast("Cloud Sync: Loaded latest data successfully!", "success");
                            } else {
                                pushToCloud(phones);
                            }
                        })
                        .catch(() => triggerToast("Cloud Sync Offline. Using Local Storage.", "warning"))
                        .finally(() => setSyncLoading(false));
                }
            }, []);

            // Helper to upload data to Supabase
            const pushToCloud = (dataToPush) => {
                if (!supabaseClient) return;
                setSyncLoading(true);
                supabaseClient
                    .from('ledger_store')
                    .upsert({ id: 'main_inventory', phones: dataToPush })
                    .then(({ error }) => {
                        if (error) throw error;
                        triggerToast("Synced successfully with Supabase Cloud!", "success");
                    })
                    .catch(() => triggerToast("Failed to write to Cloud. Queue saved locally.", "warning"))
                    .finally(() => setSyncLoading(false));
            };

            const updatePhonesAndPersist = (newPhones) => {
                setPhones(newPhones);
                localStorage.setItem('flipflow_inventory', JSON.stringify(newPhones));
                pushToCloud(newPhones);
            };

            const handleForceRefresh = () => {
                if (!supabaseClient) {
                    triggerToast("Supabase is not configured.", "warning");
                    return;
                }
                setSyncLoading(true);
                supabaseClient
                    .from('ledger_store')
                    .select('phones')
                    .eq('id', 'main_inventory')
                    .single()
                    .then(({ data, error }) => {
                        if (!error && data && data.phones) {
                            setPhones(data.phones);
                            localStorage.setItem('flipflow_inventory', JSON.stringify(data.phones));
                            triggerToast("Pulled latest cloud data successfully!", "success");
                        }
                    })
                    .catch(() => triggerToast("Failed to fetch cloud database.", "warning"))
                    .finally(() => setSyncLoading(false));
            };

            const handleUnlock = (e) => {
                e.preventDefault();
                if (passwordInput === '314') {
                    setIsUnlocked(true);
                    sessionStorage.setItem('flipflow_unlocked', 'true');
                    setPasswordError(false);
                    triggerToast("System unlocked.", "success");
                } else {
                    setPasswordError(true);
                    setPasswordInput('');
                }
            };

            // Dynamic Ledger Sequence Balance Builder
            const ledger = useMemo(() => {
                let list = [];
                phones.forEach(p => {
                    list.push({
                        id: `${p.id}-buy`,
                        phoneId: p.id,
                        date: p.buyDate,
                        sequence: p.buySequence || Date.now(),
                        model: p.model,
                        type: p.reinvestment ? 'REINVEST_BUY' : 'INITIAL_BUY',
                        amount: p.reinvestment ? -Number(p.buyPrice) : 0,
                        description: p.reinvestment 
                            ? `Reinvestment Purchase — ${p.model}` 
                            : `Initial Inventory — ${p.model}`
                    });

                    if (p.sellDate) {
                        list.push({
                            id: `${p.id}-sell`,
                            phoneId: p.id,
                            date: p.sellDate,
                            sequence: p.sellSequence || Date.now() + 1,
                            model: p.model,
                            type: 'SELL',
                            amount: Number(p.actualSellPrice || p.expectedSellPrice),
                            description: `Sold — ${p.model}`
                        });
                    }
                });

                list.sort((a, b) => {
                    const diff = new Date(a.date) - new Date(b.date);
                    if (diff !== 0) return diff;
                    return a.sequence - b.sequence;
                });

                let running = 0;
                return list.map(item => {
                    running += item.amount;
                    return { ...item, balance: running };
                });
            }, [phones]);

            const stats = useMemo(() => {
                const availableCash = ledger.length > 0 ? ledger[ledger.length - 1].balance : 0;
                
                let inventoryCost = 0;
                let inventoryMarketValue = 0;
                let totalSales = 0;
                let totalProfit = 0;
                let phonesSold = 0;
                let phonesInStock = 0;
                let totalDaysToSell = 0;
                let soldBuyPriceSum = 0;
                let potentialSalesRevenue = 0;

                let highestProfit = -Infinity;
                let lowestProfit = Infinity;
                let highestProfitPhone = null;
                let lowestProfitPhone = null;

                let fastestSale = Infinity;
                let slowestSale = -Infinity;

                phones.forEach(p => {
                    const isSold = !!p.sellDate;
                    const buyVal = Number(p.buyPrice);
                    const expectedVal = Number(p.expectedSellPrice);
                    const actualVal = Number(p.actualSellPrice || p.expectedSellPrice);

                    if (!isSold) {
                        inventoryCost += buyVal;
                        inventoryMarketValue += expectedVal;
                        phonesInStock++;
                        potentialSalesRevenue += expectedVal;
                    } else {
                        const profit = actualVal - buyVal;
                        totalSales += actualVal;
                        totalProfit += profit;
                        phonesSold++;
                        soldBuyPriceSum += buyVal;
                        potentialSalesRevenue += actualVal;

                        const days = Math.max(0, Math.round((new Date(p.sellDate) - new Date(p.buyDate)) / 86400000));
                        totalDaysToSell += days;

                        if (days < fastestSale) fastestSale = days;
                        if (days > slowestSale) slowestSale = days;

                        if (profit > highestProfit) {
                            highestProfit = profit;
                            highestProfitPhone = p;
                        }
                        if (profit < lowestProfit) {
                            lowestProfit = profit;
                            lowestProfitPhone = p;
                        }
                    }
                });

                return {
                    availableCash,
                    inventoryCost,
                    inventoryMarketValue,
                    totalSales,
                    totalProfit,
                    phonesSold,
                    phonesInStock,
                    avgProfit: phonesSold > 0 ? totalProfit / phonesSold : 0,
                    avgDays: phonesSold > 0 ? totalDaysToSell / phonesSold : 0,
                    roi: soldBuyPriceSum > 0 ? (totalProfit / soldBuyPriceSum) * 100 : 0,
                    highestProfit: highestProfit === -Infinity ? 0 : highestProfit,
                    highestProfitPhone,
                    lowestProfit: lowestProfit === Infinity ? 0 : lowestProfit,
                    lowestProfitPhone,
                    fastestSale: fastestSale === Infinity ? 0 : fastestSale,
                    slowestSale: slowestSale === -Infinity ? 0 : slowestSale,
                    potentialSalesRevenue,
                    soldBuyPriceSum
                };
            }, [phones, ledger]);

            const uniqueModels = useMemo(() => {
                const set = new Set();
                phones.forEach(p => p.model && set.add(p.model));
                return Array.from(set);
            }, [phones]);

            const filteredPhones = useMemo(() => {
                return phones.filter(p => {
                    const matchesSearch = p.model.toLowerCase().includes(searchTerm.toLowerCase()) || (p.imei && p.imei.includes(searchTerm));
                    const matchesModel = filterModel ? p.model === filterModel : true;
                    const matchesStatus = filterStatus === 'all' ? true : (filterStatus === 'sold' ? !!p.sellDate : !p.sellDate);
                    const matchesReinvest = filterReinvestment === 'all' ? true : (filterReinvestment === 'yes' ? p.reinvestment : !p.reinvestment);
                    return matchesSearch && matchesModel && matchesStatus && matchesReinvest;
                });
            }, [phones, searchTerm, filterModel, filterStatus, filterReinvestment]);

            // Filtered Protectors Data
            const filteredProtectors = useMemo(() => {
                const query = protectorSearchQuery.toLowerCase().trim();
                if (!query) return protectorCompatibilityData;
                return protectorCompatibilityData.filter(item => {
                    const primaryMatch = item.primary.toLowerCase().includes(query);
                    const fitsMatch = item.fits.some(f => f.toLowerCase().includes(query));
                    return primaryMatch || fitsMatch;
                });
            }, [protectorSearchQuery]);

            const handleToggleStatus = (phone, targetStatus) => {
                if (targetStatus === 'sold') {
                    setSelectedPhone(phone);
                    setModalBuyPrice(phone.buyPrice);
                    setModalExpectedSellPrice(phone.expectedSellPrice);
                    setModalLocalROI(globalTargetROI);
                    setIsSellModalOpen(true);
                } else {
                    const updated = phones.map(p => {
                        if (p.id === phone.id) {
                            return { ...p, sellDate: null, actualSellPrice: null, sellSequence: null };
                        }
                        return p;
                    });
                    updatePhonesAndPersist(updated);
                    triggerToast(`${phone.model} marked back to Unsold`, 'warning');
                }
            };

            const handleAddPhone = (formData) => {
                const newPhone = {
                    ...formData,
                    id: 'phone-' + Date.now(),
                    buySequence: Date.now(),
                    sellSequence: formData.sellDate ? Date.now() + 1 : null
                };
                updatePhonesAndPersist([...phones, newPhone]);
            };

            const handleEditPhone = (updatedPhone) => {
                const updated = phones.map(p => {
                    if (p.id === updatedPhone.id) {
                        return {
                            ...updatedPhone,
                            sellSequence: updatedPhone.sellDate && !p.sellDate ? Date.now() : p.sellSequence
                        };
                    }
                    return p;
                });
                updatePhonesAndPersist(updated);
            };

            const handleDeletePhone = (id) => {
                if (window.confirm("Delete this entry? This modifies ledger history.")) {
                    const updated = phones.filter(p => p.id !== id);
                    updatePhonesAndPersist(updated);
                }
            };

            // Calculated parameters for active modals
            const modalPricingAssessment = useMemo(() => {
                const buyVal = Number(modalBuyPrice) || 0;
                const expectedVal = Number(modalExpectedSellPrice) || 0;
                
                const suggestedPrice = buyVal * (1 + modalLocalROI / 100);
                const expectedProfitSuggest = suggestedPrice - buyVal;

                const actualExpectedProfit = expectedVal - buyVal;
                const actualExpectedROI = buyVal > 0 ? (actualExpectedProfit / buyVal) * 100 : 0;

                let smartColorStyles = {
                    border: 'border-slate-800',
                    bg: 'bg-slate-900/40',
                    text: 'text-slate-400',
                    status: 'Pending inputs...'
                };

                if (buyVal > 0 && expectedVal > 0) {
                    const diff = expectedVal - suggestedPrice;
                    if (diff < -0.01) {
                        smartColorStyles = {
                            border: 'border-amber-500/20',
                            bg: 'bg-amber-500/5',
                            text: 'text-amber-400',
                            status: 'Below target ROI'
                        };
                    } else if (Math.abs(diff) <= 0.01) {
                        smartColorStyles = {
                            border: 'border-emerald-500/20',
                            bg: 'bg-emerald-500/5',
                            text: 'text-emerald-400',
                            status: 'Target reached'
                        };
                    } else {
                        smartColorStyles = {
                            border: 'border-purple-500/20',
                            bg: 'bg-purple-500/5',
                            text: 'text-purple-400',
                            status: 'Above target ROI'
                        };
                    }
                }

                return {
                    suggestedPrice,
                    expectedProfitSuggest,
                    actualExpectedProfit,
                    actualExpectedROI,
                    smartColorStyles
                };
            }, [modalBuyPrice, modalExpectedSellPrice, modalLocalROI]);

            // Copy helper
            const copyToClipboard = (text, label) => {
                navigator.clipboard.writeText(text);
                triggerToast(`Copied ${label} to clipboard!`, 'success');
            };

            const exportCSV = () => {
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += "Phone Model,IMEI,Buy Price,Expected Sell Price,Actual Sell Price,Buy Date,Sell Date,Reinvestment,Notes\n";
                phones.forEach(p => {
                    const row = [
                        `"${p.model}"`,
                        `"${p.imei || ''}"`,
                        p.buyPrice,
                        p.expectedSellPrice,
                        p.actualSellPrice || '',
                        p.buyDate,
                        p.sellDate || '',
                        p.reinvestment ? 'Yes' : 'No',
                        `"${p.notes || ''}"`
                    ].join(",");
                    csvContent += row + "\n";
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `flipflow_export_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                triggerToast("CSV Sheet exported successfully", "success");
            };

            const exportJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(phones, null, 2));
                const dlAnchorElem = document.createElement('a');
                dlAnchorElem.setAttribute("href", dataStr);
                dlAnchorElem.setAttribute("download", `flipflow_backup_${new Date().toISOString().split('T')[0]}.json`);
                dlAnchorElem.click();
                triggerToast("Local JSON database exported", "success");
            };

            const importJSON = (e) => {
                const fileReader = new FileReader();
                fileReader.onload = event => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (Array.isArray(parsed)) {
                            updatePhonesAndPersist(parsed);
                            triggerToast("Database successfully restored from JSON file!", "success");
                        } else {
                            triggerToast("Invalid format. Expecting JSON array.", "warning");
                        }
                    } catch (err) {
                        triggerToast("Failed to parse file structure.", "warning");
                    }
                };
                fileReader.readAsText(e.target.files[0]);
            };

            if (!isUnlocked) {
                return (
                    <div class="min-h-screen bg-slate-950 flex items-center justify-center p-4 relative overflow-hidden">
                        <div class="absolute w-[300px] h-[300px] bg-indigo-600/10 blur-[120px] rounded-full top-1/4 left-1/3"></div>
                        <div class="absolute w-[250px] h-[250px] bg-purple-600/10 blur-[100px] rounded-full bottom-1/4 right-1/3"></div>

                        <div class="w-full max-w-md bg-slate-900/50 backdrop-blur-xl border border-slate-800/80 p-8 rounded-3xl shadow-2xl relative z-10 text-center">
                            <div class="inline-flex p-4 bg-indigo-500/10 text-indigo-400 rounded-2xl mb-5 shadow-inner">
                                <Icons.Lock />
                            </div>
                            <h1 class="text-2xl font-black tracking-tight text-white mb-2">FlipFlow Hub</h1>
                            <p class="text-xs text-slate-400 mb-6 leading-relaxed">Financial ledger protection active.<br />Enter security passcode to unlock system variables.</p>
                            
                            <form onSubmit={handleUnlock} class="space-y-4">
                                <div class="relative">
                                    <input 
                                        type="password" 
                                        placeholder="••••"
                                        value={passwordInput}
                                        onChange={(e) => setPasswordInput(e.target.value)}
                                        class={`w-full bg-slate-950 border text-center text-xl font-bold tracking-widest text-white rounded-xl py-3 px-4 focus:outline-none transition-all ${passwordError ? 'border-rose-500 ring-2 ring-rose-500/20' : 'border-slate-800 focus:border-indigo-500'}`}
                                        autoFocus
                                    />
                                    {passwordError && (
                                        <p class="text-rose-400 text-[11px] font-semibold mt-1.5 animate-bounce">Access denied. Passcode invalid.</p>
                                    )}
                                </div>
                                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/10">
                                    Access Ledger
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const cloudSyncActive = supabaseKey && supabaseKey !== "PASTE_YOUR_ANON_PUBLIC_KEY_HERE" && supabaseClient !== null;

            return (
                <div class="flex flex-col md:flex-row min-h-screen text-slate-100 bg-slate-950">
                    {/* Sidebar */}
                    <aside class="w-full md:w-64 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 p-6 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center gap-3 mb-8">
                                <div class="bg-indigo-600 p-2.5 rounded-xl">
                                    <Icons.Euro />
                                </div>
                                <div>
                                    <h1 class="text-xl font-bold tracking-tight">FlipFlow</h1>
                                    <div class="flex items-center gap-1.5 mt-0.5">
                                        <span class="text-xs text-indigo-400 font-semibold tracking-wider uppercase">Flipping Engine</span>
                                    </div>
                                </div>
                            </div>

                            <nav class="space-y-1.5 font-sans">
                                <button onClick={() => setActiveTab('dashboard')} class={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/10' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'}`}>
                                    <Icons.BarChart /> Dashboard
                                </button>
                                <button onClick={() => setActiveTab('inventory')} class={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${activeTab === 'inventory' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/10' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'}`}>
                                    <Icons.Layers /> Inventory Manager
                                </button>
                                <button onClick={() => setActiveTab('ledger')} class={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${activeTab === 'ledger' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/10' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'}`}>
                                    <Icons.History /> Cash Flow Ledger
                                </button>
                                <button onClick={() => setActiveTab('stats')} class={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${activeTab === 'stats' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/10' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'}`}>
                                    <Icons.TrendingUp /> Business Metrics
                                </button>
                                <button onClick={() => { setActiveTab('market-search'); setMarketSubTab('listings'); }} class={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${activeTab === 'market-search' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/10' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'}`}>
                                    <Icons.Eye /> Market Research
                                </button>
                                <button onClick={() => setActiveTab('mobile-prices')} class={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${activeTab === 'mobile-prices' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/10' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'}`}>
                                    <Icons.Smartphone /> Mobile Prices
                                </button>
                                {/* NEW SIDEBAR ITEM: PROTECTORS */}
                                <button onClick={() => setActiveTab('protectors')} class={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${activeTab === 'protectors' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/10' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'}`}>
                                    <Icons.Shield /> Protectors
                                </button>
                            </nav>
                        </div>

                        {/* Direct Cloud Settings Bar */}
                        <div class="mt-8 pt-6 border-t border-slate-800/60 space-y-3">
                            <div class="p-3 bg-slate-950/80 rounded-xl border border-slate-800/60">
                                <div class="flex items-center justify-between text-xs font-semibold text-slate-400">
                                    <span>TARGET ROI SETUP</span>
                                    <span class="text-indigo-400 font-bold">{globalTargetROI}%</span>
                                </div>
                                <input 
                                    type="range" 
                                    min="10" 
                                    max="100" 
                                    step="5"
                                    value={globalTargetROI}
                                    onChange={(e) => {
                                        const val = Number(e.target.value);
                                        setGlobalTargetROI(val);
                                        triggerToast(`Default target ROI updated to ${val}%`, 'info');
                                    }}
                                    class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500 mt-2.5"
                                />

                                        <div>
                                            <label class="block text-xs font-semibold text-slate-400 mb-1">Expected Sale Price (€) *</label>
                                            <input required type="number" step="0.01" value={modalExpectedSellPrice} onChange={(e) => setModalExpectedSellPrice(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none" />
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-400 mb-1">Purchase Date *</label>
                                        <input required name="buyDate" type="date" defaultValue={new Date().toISOString().split('T')[0]} class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none" />
                                    </div>
                                    <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                                        <button type="button" onClick={() => setIsAddModalOpen(false)} class="px-4 py-2 border border-slate-800 rounded-xl text-sm hover:bg-slate-800">Cancel</button>
                                        <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-sm font-bold hover:bg-indigo-700">Register Unit</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
